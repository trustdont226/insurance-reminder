services:
  - type: web
    name: insurance-reminder
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: 5000
      - key: HOST
        value: 0.0.0.0
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: DATABASE_URL
        sync: false   # set in Render dashboard
      - key: SUPABASE_URL
        sync: false   # set in Render dashboard
      - key: SUPABASE_KEY
        sync: false   # set in Render dashboard
      - key: SUPABASE_BUCKET
        value: pdfs
